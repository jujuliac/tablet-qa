name: test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: npm i --no-save playwright@1.64.1
      - name: Install CJK fonts (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: Unit tests
        run: npm test
      - name: Browser measurement test
        run: npm run test:browser

  demo:
    name: demo page (${{ matrix.os }}, ${{ matrix.browser }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        browser: [chrome, bundled, webkit]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: npm i --no-save playwright@1.64.1
      - name: Install Playwright browser
        if: matrix.browser != 'chrome'
        run: |
          B=${{ matrix.browser == 'webkit' && 'webkit' || 'chromium' }}
          if [ "$RUNNER_OS" = "Linux" ]; then npx playwright install --with-deps "$B"; else npx playwright install "$B"; fi
      - name: Install CJK fonts (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: Start demo server
        working-directory: examples/demo-site
        run: |
          python -m http.server 4810 --bind 127.0.0.1 > /dev/null 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:4810/before/ > /dev/null && exit 0; sleep 1; done
          echo "demo server did not start"; exit 1
      - name: Write config
        run: node .github/demo-check.mjs config ${{ matrix.browser }}
      - name: shots
        run: node scripts/shots.mjs examples/demo-site/ci-${{ matrix.browser }}.json --site=both --run=ci-${{ matrix.browser }}-shots
      - name: sweep
        run: node scripts/sweep.mjs examples/demo-site/ci-${{ matrix.browser }}.json --site=before --run=ci-${{ matrix.browser }}-sweep
      - name: Compare with expected findings
        run: node .github/demo-check.mjs check ${{ matrix.browser }}
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-${{ matrix.os }}-${{ matrix.browser }}
          path: examples/demo-site/tablet-qa-runs/
          if-no-files-found: warn
